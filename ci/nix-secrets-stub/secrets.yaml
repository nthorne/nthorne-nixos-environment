# Stub secrets file used by CI only — never contains real secrets.
#
# `nix-secrets` is a private git+ssh flake input, so CI overrides it with this
# directory. That is not enough on its own: sops-nix builds a manifest at build
# time and fails with
#
#   manifest is not valid: secret all/atuin/key ... the key 'all' cannot be found
#
# when a referenced key is missing, even though no value is ever decrypted
# before activation. So every key the configuration references must exist here
# as a well-formed sops value.
#
# The values are placeholders. The `sops.age` block below is a real age file
# encrypted to a throwaway recipient whose identity was discarded, so it parses
# but decrypts to nothing. When a new secret is added to the real repo and
# referenced by the configuration, add the same key here.

all:
  atuin:
    key: ENC[AES256_GCM,data:AAAAAAAAAAAAAAAAAAAAAA==,iv:AAAAAAAAAAAAAAAAAAAAAA==,tag:AAAAAAAAAAAAAAAAAAAAAA==,type:str]
    session: ENC[AES256_GCM,data:AAAAAAAAAAAAAAAAAAAAAA==,iv:AAAAAAAAAAAAAAAAAAAAAA==,tag:AAAAAAAAAAAAAAAAAAAAAA==,type:str]

